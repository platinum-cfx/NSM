# CONFIG SERVER

name = 'Server Name'
website = 'server.com'
host = '0.0.0.0'
port = 7788
player_slots = 1052

[settings]
debug = true
# client_token = 'gtamp'

modules = [ 'js-module' ]
# Default: the FiveM compat stack (ESX). fivem-compat loads everything under
# server/fivem_resources/ (es_extended, esx_lib, skinchanger, oxmysql).
# To run the native GTAMP gamemode instead, comment fivem-compat/fivem-client
# out and uncomment gtamp-online (it owns player spawning itself).
resources = [ 'fivem-compat', 'fivem-client', 'vmenu' ]
# resources = [ 'gtamp-online', 'vmenu', 'fivem-compat' ]

# dlc_whitelist = [ 'dlc_name' ]

[settings.others]
streaming_distance = 300.0
migration_distance = 300.0

connection_queue = false
# FIX: disable the auto-spawn at (0, 0, 71) — gtamp-online owns spawning now.
# Both spellings are set because the .cfg mixes camelCase and snake_case keys.
spawnAfterConnect = false
spawn_after_connect = false
hash_client_resource_name = true
discord_presence = true

# [settings.max_streaming]
# peds = 128
# objects = 120
# vehicles = 128
# entities = 128

# [voice]
# enabled = false
# bitrate = 64000
# external_secret = '1234567890abcdef1234567890abcdef'
# external_host = 'voice.example.com'
# external_port = 7798

# [voice.public]
# external_public_host = 'public.voice.example.com'
# external_public_port = 7800

# ---- Masterlist (server browser) ----
[masterlist]
# Set to true to appear in the GTAMP launcher's server list
announce = true
# URL of the masterlist API (no trailing path)
masterlist_url = 'http://127.0.0.1:8080'
# Server key issued by the masterlist admin (POST /keys). Keep it secret.
server_key = ''
# Public IP or domain players connect to. Leave empty to use the IP you announce from.
public_host = '127.0.0.1'
gamemode = 'Freeroam'
language = 'en'
description = 'A GTAMP server'
tags = 'freeroam, pvp'
# Mark as locked/whitelisted in the browser (auto-true if a password is set)
locked = false
announce_interval = 30
