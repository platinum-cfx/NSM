name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compat:
    name: cfx-compat runtime suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit suite (69 checks)
        run: node test/run-tests.js
        working-directory: server/resources/fivem-compat
      - name: Fork-syntax gate (skips without qb-core clone)
        run: node tools/lua-fork-transform.test.mjs
        working-directory: server/resources/fivem-compat
      - name: Live-exports gate (skips without framework clones)
        run: node tools/live-exports-check.mjs
        working-directory: server/resources/fivem-compat

  masterlist:
    name: masterlist security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test-security.js
        working-directory: masterlist

  website:
    name: website security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: website
      - run: node test-security.js
        working-directory: website

  framework-gates:
    name: real qb-core + es_extended gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # NOTE: clones framework HEAD for now — Prompts 6/7 pin exact commits
      # and move these clones into a checked-in setup script.
      - name: Clone legally redistributable frameworks (GPL-3.0)
        run: |
          cd server/resources/fivem-compat
          git clone --depth 1 https://github.com/qbcore-framework/qb-core real_resources/qb-core
          git clone --depth 1 https://github.com/esx-framework/esx-legacy real_resources/esx-legacy
      - name: qb-core fork-syntax compile gate
        run: node tools/lua-fork-transform.test.mjs
        working-directory: server/resources/fivem-compat
      - name: Load real frameworks through the runtime
        run: |
          node tools/load-real.mjs qb-core
          node tools/load-real.mjs "esx-legacy/[core]/esx_lib,esx-legacy/[core]/es_extended"
        working-directory: server/resources/fivem-compat
      - name: Live exports vs real frameworks (17 checks)
        run: node tools/live-exports-check.mjs
        working-directory: server/resources/fivem-compat
